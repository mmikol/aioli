[pytest]
testpaths = tests
# The contract test spends points against a real key, so it is on demand
# (`pytest -m contract`) and never part of an ordinary run.
addopts = -m "not contract"
markers =
    database: needs a live PostgreSQL; skipped when AIOLI_NO_DATABASE is set
    contract: calls the real Spoonacular API; needs a key, never runs in CI
